openapi: 3.0.4
info:
  title: Sistema de notas parciales — API
  version: 1.0.0
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT.html
  description: |
    Contrato de las rutas implementadas en `Backend/app/Config/Routes.php`.
    Todas las respuestas JSON exitosas usan `{ "data": ... }` y los errores
    controlados usan `{ "error": "motivo" }`. Solo `/login` y `/healt` son públicos.
    Los importes decimales devueltos por la API son cadenas con dos cifras
    decimales. El profesor se crea una vez con `php spark profesor:crear`;
    ese comando no es una ruta HTTP.
servers:
  - url: /api
    description: Proxy local de Swagger UI hacia el backend
tags:
  - name: Salud
    description: Disponibilidad de la API y conexión a MySQL.
  - name: Autenticación
    description: Inicio de sesión y contraseñas.
  - name: Cuatrimestres y cursos
    description: Períodos, cursos y grupos.
  - name: Catálogo
    description: Opciones reutilizables de evaluación.
  - name: Evaluación
    description: Componentes y notas individuales.
  - name: Matrículas
    description: Estudiantes y su inscripción en cursos.
  - name: Asistencia
    description: Sesiones y condiciones de asistencia.
  - name: Concentrados
    description: Tablas de calificaciones y exportación.
  - name: Estudiante
    description: Consultas del estudiante autenticado.
security:
  - bearerAuth: []
paths:
  /healt:
    get:
      tags: [Salud]
      summary: Comprobar servidor y base de datos
      description: Ruta pública que ejecuta `SELECT 1` en MySQL. No expone credenciales ni detalles de conexión.
      operationId: checkHealth
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Entrega un JWT válido durante una hora sin exigir un token previo.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/Login' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/estudiantes/{estudianteId}/contrasena:
    post:
      tags: [Autenticación]
      summary: Generar una nueva contraseña para un estudiante
      description: Reemplaza el hash anterior; la contraseña devuelta se muestra una sola vez al profesor.
      operationId: generateStudentPassword
      parameters:
        - $ref: '#/components/parameters/EstudianteId'
      responses:
        '200': { $ref: '#/components/responses/GeneratedPassword' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /estudiante/perfil/contrasena:
    put:
      tags: [Autenticación, Estudiante]
      summary: Cambiar la contraseña propia
      operationId: changeStudentPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '200': { $ref: '#/components/responses/Updated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cuatrimestres:
    get:
      tags: [Cuatrimestres y cursos]
      summary: Listar cuatrimestres
      operationId: listQuarters
      responses:
        '200': { $ref: '#/components/responses/QuarterList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Cuatrimestres y cursos]
      summary: Crear cuatrimestre
      description: La fecha de cierre debe estar exactamente 98 días después del inicio. Se generan quince fechas semanales en una transacción.
      operationId: createQuarter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuarterInput' }
      responses:
        '201': { $ref: '#/components/responses/QuarterCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos:
    get:
      tags: [Cuatrimestres y cursos]
      summary: Listar cursos y grupos
      operationId: listCourses
      responses:
        '200': { $ref: '#/components/responses/CourseList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Cuatrimestres y cursos]
      summary: Crear curso y grupo
      description: Se crean automáticamente quince sesiones pendientes, una por fecha programada del cuatrimestre.
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201': { $ref: '#/components/responses/CourseCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos/{cursoId}:
    delete:
      tags: [Cuatrimestres y cursos]
      summary: Eliminar un curso cerrado
      description: |
        Solo se permite después de la fecha de cierre del cuatrimestre. El flujo
        de confirmación previa corresponde a la interfaz. Se conservan estudiantes,
        cuatrimestre y catálogo; se eliminan los registros propios del curso.
      operationId: deleteCourse
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/catalogo:
    get:
      tags: [Catálogo]
      summary: Listar actividades del catálogo
      operationId: listCatalog
      responses:
        '200': { $ref: '#/components/responses/CatalogList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Catálogo]
      summary: Crear actividad del catálogo
      description: El nombre es único sin distinguir mayúsculas ni tildes.
      operationId: createCatalogActivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '201': { $ref: '#/components/responses/CatalogCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/catalogo/{id}:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
    put:
      tags: [Catálogo]
      summary: Editar actividad libre del catálogo
      operationId: updateCatalogActivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '200': { $ref: '#/components/responses/CatalogUpdated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Catálogo]
      summary: Eliminar actividad libre del catálogo
      operationId: deleteCatalogActivity
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos/{cursoId}/componentes:
    parameters:
      - $ref: '#/components/parameters/CursoId'
    get:
      tags: [Evaluación]
      summary: Listar componentes y actividades individuales de un curso
      operationId: listComponents
      responses:
        '200': { $ref: '#/components/responses/ComponentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Evaluación]
      summary: Crear componente con puntaje por actividad y porcentaje repartido
      description: |
        Genera de 1 a 15 actividades individuales. Reparte solo el porcentaje
        total en partes iguales truncadas a dos decimales, sin redistribuir el
        residuo; asigna el puntaje por actividad íntegro a cada una. La suma de
        porcentajes del curso no puede superar 100 %. Los componentes históricos
        conservan los puntajes que sus actividades ya tenían asignados.
      operationId: createComponent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentInput' }
      responses:
        '201': { $ref: '#/components/responses/ComponentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos/{cursoId}/componentes/{componenteId}:
    parameters:
      - $ref: '#/components/parameters/CursoId'
      - $ref: '#/components/parameters/ComponenteId'
    delete:
      tags: [Evaluación]
      summary: Eliminar un componente de evaluación
      description: |
        Puede eliminarse en cualquier momento del cuatrimestre. La interfaz debe
        pedir confirmación antes de llamar esta operación, incluso sin notas.
        Si hay alguna calificación registrada, incluida 0,00, y no se envía
        confirmar_con_notas=true, responde 409 sin modificar datos. Tras la
        confirmación informada, elimina el componente, sus actividades individuales,
        calificaciones y observaciones. Conserva el curso, las matrículas,
        asistencias, demás componentes y actividades del catálogo. Los resultados
        y concentrados se calculan con los datos restantes en consultas posteriores.
      operationId: deleteComponent
      parameters:
        - name: confirmar_con_notas
          in: query
          required: false
          description: Enviar true solo tras advertir al profesor sobre la pérdida de calificaciones y recibir su confirmación.
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/calificaciones/{matriculaId}/{actividadId}:
    get:
      tags: [Evaluación]
      summary: Consultar la nota y observación de una actividad individual
      description: Devuelve valores nulos si aún no hay calificación. La matrícula y la actividad deben pertenecer al mismo curso.
      operationId: getGrade
      parameters:
        - $ref: '#/components/parameters/MatriculaId'
        - $ref: '#/components/parameters/ActividadId'
      responses:
        '200': { $ref: '#/components/responses/GradeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Evaluación]
      summary: Registrar o actualizar una nota individual
      description: Los puntos deben estar entre cero y el puntaje asignado a la actividad del mismo curso.
      operationId: saveGrade
      parameters:
        - $ref: '#/components/parameters/MatriculaId'
        - $ref: '#/components/parameters/ActividadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeInput' }
      responses:
        '200': { $ref: '#/components/responses/GradeSaved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/estudiantes:
    get:
      tags: [Matrículas]
      summary: Listar estudiantes registrados
      operationId: listStudents
      responses:
        '200': { $ref: '#/components/responses/StudentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos/{cursoId}/matriculas:
    parameters:
      - $ref: '#/components/parameters/CursoId'
    get:
      tags: [Matrículas]
      summary: Listar matrículas de un curso y grupo
      operationId: listEnrollments
      responses:
        '200': { $ref: '#/components/responses/EnrollmentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Matrículas]
      summary: Matricular estudiante
      description: Reutiliza el estudiante si ya existe su correo exacto; valida el dominio permitido.
      operationId: enrollStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentInput' }
      responses:
        '201': { $ref: '#/components/responses/EnrollmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos/{cursoId}/sesiones:
    parameters:
      - $ref: '#/components/parameters/CursoId'
    get:
      tags: [Asistencia]
      summary: Listar sesiones y condiciones del curso
      operationId: listSessions
      responses:
        '200': { $ref: '#/components/responses/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/sesiones/{sesionId}/asistencias:
    put:
      tags: [Asistencia]
      summary: Registrar o corregir la asistencia de una sesión programada
      operationId: updateAttendance
      parameters:
        - $ref: '#/components/parameters/SesionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/AttendanceSaved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos/{cursoId}/concentrado:
    get:
      tags: [Concentrados]
      summary: Consultar concentrado de un curso y grupo
      operationId: professorConcentrate
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200': { $ref: '#/components/responses/Concentrate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /profesor/cursos/{cursoId}/concentrado.xlsx:
    get:
      tags: [Concentrados]
      summary: Descargar el concentrado vigente en Excel
      operationId: downloadConcentrate
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200':
          description: Archivo XLSX del curso y grupo.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Nombre del archivo adjunto.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /estudiante/cursos:
    get:
      tags: [Estudiante]
      summary: Listar los cursos propios
      operationId: studentCourses
      responses:
        '200': { $ref: '#/components/responses/StudentCourseList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /estudiante/cursos/{cursoId}/calificaciones:
    get:
      tags: [Estudiante]
      summary: Consultar tarjetas de notas y resultado del curso propio
      operationId: studentGrades
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200': { $ref: '#/components/responses/StudentGrades' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /estudiante/cursos/{cursoId}/asistencia:
    get:
      tags: [Estudiante]
      summary: Consultar asistencia en un curso propio
      operationId: studentAttendance
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200': { $ref: '#/components/responses/StudentAttendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /estudiante/cursos/{cursoId}/concentrado:
    get:
      tags: [Estudiante, Concentrados]
      summary: Consultar la tabla de calificaciones propia
      operationId: studentConcentrate
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '200': { $ref: '#/components/responses/Concentrate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pegue el JWT obtenido en `POST /login`, sin el prefijo `Bearer`.
  parameters:
    CursoId:
      name: cursoId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ComponenteId:
      name: componenteId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    EstudianteId:
      name: estudianteId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CatalogId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    MatriculaId:
      name: matriculaId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ActividadId:
      name: actividadId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SesionId:
      name: sesionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    HealthData:
      type: object
      required: [servidor, base_datos]
      properties:
        servidor: { type: string, enum: [ok] }
        base_datos: { type: string, enum: [ok] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Motivo del rechazo sin secretos. }
    DecimalInput:
      description: |
        Número o cadena con hasta dos decimales. Las cadenas aceptan punto o coma;
        por ejemplo `15.23` y `15,23`.
      oneOf:
        - type: string
          pattern: '^\d+(?:[.,]\d{1,2})?$'
          example: '15,23'
        - type: number
          minimum: 0
          example: 15.23
    DecimalOutput:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '15.23'
    NullableDecimalOutput:
      type: string
      nullable: true
      pattern: '^\d+\.\d{2}$'
      description: "`null` indica que todavía no se registró una nota."
    LoginInput:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email, maxLength: 254, example: 'profesor@ucatolica.ac.cr' }
        contrasena: { type: string, format: password, minLength: 1, writeOnly: true }
    LoginData:
      type: object
      required: [token, expires_in, rol]
      properties:
        token: { type: string, description: JWT firmado; no se almacena en el servidor. }
        expires_in: { type: integer, enum: [3600], description: Segundos de vigencia. }
        rol: { type: string, enum: [profesor, estudiante] }
    GeneratedPasswordData:
      type: object
      required: [contrasena]
      properties:
        contrasena: { type: string, description: Contraseña nueva en texto claro entregada una vez al profesor. }
    ChangePasswordInput:
      type: object
      required: [contrasena_nueva]
      properties:
        contrasena_nueva: { type: string, format: password, minLength: 1, writeOnly: true }
    UpdatedData:
      type: object
      required: [actualizada]
      properties:
        actualizada: { type: boolean, enum: [true] }
    DeletedData:
      type: object
      required: [eliminado]
      properties:
        eliminado: { type: boolean, enum: [true] }
    QuarterInput:
      type: object
      required: [codigo, fecha_inicio, fecha_cierre]
      properties:
        codigo: { type: string, pattern: '^[1-3]-\d{4}$', example: '2-2026' }
        fecha_inicio: { type: string, format: date, example: '2026-05-01' }
        fecha_cierre: { type: string, format: date, example: '2026-08-07', description: Exactamente 98 días después de fecha_inicio. }
    Quarter:
      allOf:
        - $ref: '#/components/schemas/QuarterInput'
        - type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 1 }
    CourseInput:
      type: object
      required: [cuatrimestre_id, nombre, codigo, numero_grupo]
      properties:
        cuatrimestre_id: { type: integer, minimum: 1 }
        nombre: { type: string, minLength: 1, maxLength: 255 }
        codigo: { type: string, minLength: 1, maxLength: 64 }
        numero_grupo: { type: integer, description: Número que distingue grupos con el mismo código y cuatrimestre. }
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          required: [id, cuatrimestre_codigo, fecha_inicio, fecha_cierre]
          properties:
            id: { type: integer, minimum: 1 }
            cuatrimestre_codigo: { type: string, example: '2-2026' }
            fecha_inicio: { type: string, format: date }
            fecha_cierre: { type: string, format: date }
    StudentCourse:
      type: object
      required: [id, nombre, codigo, numero_grupo, cuatrimestre_codigo, fecha_inicio, fecha_cierre]
      properties:
        id: { type: integer, minimum: 1 }
        nombre: { type: string }
        codigo: { type: string }
        numero_grupo: { type: integer }
        cuatrimestre_codigo: { type: string }
        fecha_inicio: { type: string, format: date }
        fecha_cierre: { type: string, format: date }
    CatalogInput:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 255, example: 'Indagación y exposición' }
    CatalogActivity:
      allOf:
        - $ref: '#/components/schemas/CatalogInput'
        - type: object
          required: [id, en_uso]
          properties:
            id: { type: integer, minimum: 1 }
            en_uso: { type: boolean, description: Indica si la actividad está asociada a algún componente y no puede editarse ni eliminarse. }
    ComponentInput:
      type: object
      required: [actividad_catalogo_id, titulo, cantidad_actividades, porcentaje_total, puntaje_por_actividad]
      properties:
        actividad_catalogo_id: { type: integer, minimum: 1 }
        titulo: { type: string, minLength: 1, description: Máximo 128 palabras. }
        cantidad_actividades: { type: integer, minimum: 1, maximum: 15 }
        descripcion: { type: string, maxLength: 256, nullable: true }
        porcentaje_total:
          allOf: [ { $ref: '#/components/schemas/DecimalInput' } ]
          description: Entre 0 y 100; la suma de componentes del curso no puede superar 100.
        puntaje_por_actividad:
          allOf: [ { $ref: '#/components/schemas/DecimalInput' } ]
          description: Entre 1 y 100 puntos; se asigna íntegro a cada actividad.
    IndividualActivity:
      type: object
      required: [componente_id, numero, porcentaje_asignado, puntaje_asignado]
      properties:
        id: { type: integer, minimum: 1, description: Presente en consultas; omitido al crear un componente. }
        componente_id: { type: integer, minimum: 1 }
        numero: { type: integer, minimum: 1, maximum: 15 }
        porcentaje_asignado: { $ref: '#/components/schemas/DecimalOutput' }
        puntaje_asignado:
          allOf: [ { $ref: '#/components/schemas/DecimalOutput' } ]
          description: Puntaje íntegro de esta actividad, igual al puntaje por actividad del componente nuevo; en componentes históricos conserva el valor anterior.
    Component:
      type: object
      required: [id, curso_id, actividad_catalogo_id, titulo, cantidad_actividades, porcentaje_total, puntaje_por_actividad, actividad_catalogo, tiene_calificaciones, actividades]
      properties:
        id: { type: integer, minimum: 1 }
        curso_id: { type: integer, minimum: 1 }
        actividad_catalogo_id: { type: integer, minimum: 1 }
        titulo: { type: string }
        cantidad_actividades: { type: integer, minimum: 1, maximum: 15 }
        descripcion: { type: string, nullable: true }
        porcentaje_total: { $ref: '#/components/schemas/DecimalOutput' }
        puntaje_por_actividad: { $ref: '#/components/schemas/DecimalOutput' }
        actividad_catalogo: { type: string }
        tiene_calificaciones:
          type: boolean
          description: Verdadero si alguna actividad tiene una calificación registrada, incluida 0,00; se calcula al consultar.
        actividades:
          type: array
          items: { $ref: '#/components/schemas/IndividualActivity' }
    ComponentCreatedData:
      type: object
      required: [id, actividades]
      properties:
        id: { type: integer, minimum: 1 }
        actividades:
          type: array
          items: { $ref: '#/components/schemas/IndividualActivity' }
    Student:
      type: object
      required: [usuario_id, nombre, primer_apellido, segundo_apellido, correo]
      properties:
        usuario_id: { type: integer, minimum: 1 }
        nombre: { type: string }
        primer_apellido: { type: string }
        segundo_apellido: { type: string }
        correo: { type: string, format: email }
    EnrollmentInput:
      type: object
      required: [nombre, primer_apellido, segundo_apellido, correo]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 255 }
        primer_apellido: { type: string, minLength: 1, maxLength: 255 }
        segundo_apellido: { type: string, minLength: 1, maxLength: 255 }
        correo: { type: string, format: email, maxLength: 254, description: Dominio registrado en dominios_permitidos. }
    Enrollment:
      type: object
      required: [id, curso_id, estudiante_id, nombre, primer_apellido, segundo_apellido, correo]
      properties:
        id: { type: integer, minimum: 1 }
        curso_id: { type: integer, minimum: 1 }
        estudiante_id: { type: integer, minimum: 1 }
        nombre: { type: string }
        primer_apellido: { type: string }
        segundo_apellido: { type: string }
        correo: { type: string, format: email }
    EnrollmentCreatedData:
      type: object
      required: [id, estudiante_id, curso_id]
      properties:
        id: { type: integer, minimum: 1 }
        estudiante_id: { type: integer, minimum: 1 }
        curso_id: { type: integer, minimum: 1 }
    GradeInput:
      type: object
      required: [puntos_obtenidos]
      properties:
        puntos_obtenidos:
          allOf: [ { $ref: '#/components/schemas/DecimalInput' } ]
          description: Entre 0 y el puntaje asignado a la actividad.
        observacion: { type: string, maxLength: 125, nullable: true }
    GradeSavedData:
      type: object
      required: [id, matricula_id, actividad_individual_id, puntos_obtenidos, observacion]
      properties:
        id: { type: integer, minimum: 1 }
        matricula_id: { type: integer, minimum: 1 }
        actividad_individual_id: { type: integer, minimum: 1 }
        puntos_obtenidos: { $ref: '#/components/schemas/DecimalOutput' }
        observacion: { type: string, nullable: true, maxLength: 125 }
    GradeDetailData:
      type: object
      required: [matricula_id, actividad_individual_id, puntos_obtenidos, observacion]
      properties:
        matricula_id: { type: integer, minimum: 1 }
        actividad_individual_id: { type: integer, minimum: 1 }
        puntos_obtenidos: { $ref: '#/components/schemas/NullableDecimalOutput' }
        observacion: { type: string, nullable: true, maxLength: 125 }
    AttendanceEntryInput:
      type: object
      required: [matricula_id, condicion]
      properties:
        matricula_id: { type: integer, minimum: 1 }
        condicion: { type: string, enum: [presente, ausente, justificado] }
    AttendanceUpdateInput:
      type: object
      required: [asistencias]
      properties:
        asistencias:
          type: array
          description: Exactamente una condición por cada matrícula vigente; sirve para el primer registro y para corregirlo. No se admite si no hay matrículas.
          items: { $ref: '#/components/schemas/AttendanceEntryInput' }
    SessionAttendance:
      allOf:
        - $ref: '#/components/schemas/AttendanceEntryInput'
        - type: object
          required: [estudiante_id]
          properties:
            estudiante_id: { type: integer, minimum: 1 }
    Session:
      type: object
      required: [id, curso_id, numero, fecha, asistencia_registrada, asistencias]
      properties:
        id: { type: integer, minimum: 1 }
        curso_id: { type: integer, minimum: 1 }
        numero: { type: integer, minimum: 1, maximum: 15 }
        fecha: { type: string, format: date }
        asistencia_registrada: { type: boolean, description: 'false si aún no se guardaron condiciones; entonces asistencias está vacío.' }
        asistencias:
          type: array
          items: { $ref: '#/components/schemas/SessionAttendance' }
    ConcentrateActivity:
      type: object
      required: [id, titulo, numero]
      properties:
        id: { type: integer, minimum: 1 }
        titulo: { type: string }
        numero: { type: integer, minimum: 1 }
    ConcentrateCell:
      type: object
      required: [actividad_id, nota, porcentaje_obtenido]
      properties:
        actividad_id: { type: integer, minimum: 1 }
        nota: { $ref: '#/components/schemas/NullableDecimalOutput' }
        porcentaje_obtenido: { $ref: '#/components/schemas/DecimalOutput' }
    ConcentrateStudent:
      type: object
      required: [matricula_id, estudiante_id, nombre, primer_apellido, segundo_apellido, correo, calificaciones]
      properties:
        matricula_id: { type: integer, minimum: 1 }
        estudiante_id: { type: integer, minimum: 1 }
        nombre: { type: string }
        primer_apellido: { type: string }
        segundo_apellido: { type: string }
        correo: { type: string, format: email }
        calificaciones:
          type: array
          items: { $ref: '#/components/schemas/ConcentrateCell' }
    ConcentrateData:
      type: object
      required: [curso, actividades, estudiantes]
      properties:
        curso: { $ref: '#/components/schemas/Course' }
        actividades:
          type: array
          items: { $ref: '#/components/schemas/ConcentrateActivity' }
        estudiantes:
          type: array
          description: Para el rol estudiante, contiene solamente su propio registro.
          items: { $ref: '#/components/schemas/ConcentrateStudent' }
    StudentGradeCard:
      allOf:
        - $ref: '#/components/schemas/ConcentrateActivity'
        - type: object
          required: [actividad_catalogo, cantidad_actividades, nota, porcentaje_obtenido, observacion]
          properties:
            actividad_catalogo:
              type: string
              description: Nombre de la actividad del catálogo asociada al componente, con su grafía almacenada.
            cantidad_actividades:
              type: integer
              minimum: 1
              maximum: 15
              description: Cantidad de actividades individuales del componente al que pertenece esta tarjeta.
            nota: { $ref: '#/components/schemas/NullableDecimalOutput' }
            porcentaje_obtenido: { $ref: '#/components/schemas/DecimalOutput' }
            observacion: { type: string, nullable: true, maxLength: 125 }
    StudentGradesData:
      type: object
      required: [curso, resultado, tarjetas]
      properties:
        curso: { $ref: '#/components/schemas/Course' }
        resultado: { $ref: '#/components/schemas/DecimalOutput' }
        tarjetas:
          type: array
          items: { $ref: '#/components/schemas/StudentGradeCard' }
    StudentAttendanceEntry:
      type: object
      required: [sesion_id, fecha, condicion]
      properties:
        sesion_id: { type: integer, minimum: 1 }
        fecha: { type: string, format: date }
        condicion: { type: string, enum: [presente, ausente, justificado] }
  responses:
    Health:
      description: La API responde y la consulta a MySQL funciona.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/HealthData' }
    ServiceUnavailable:
      description: MySQL no responde o la consulta de comprobación falló; no se revelan detalles internos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Formato, límite, fecha o dato obligatorio inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Credenciales incorrectas o JWT ausente, inválido o vencido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El usuario autenticado no tiene el rol requerido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso inexistente o curso ajeno al estudiante autenticado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Duplicado, actividad vinculada u otra regla de estado incumplida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Error interno sin detalles sensibles.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Login:
      description: Inicio de sesión correcto.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/LoginData' }
    GeneratedPassword:
      description: Nueva contraseña generada.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/GeneratedPasswordData' }
    Updated:
      description: Registro actualizado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/UpdatedData' }
    Deleted:
      description: Registro eliminado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/DeletedData' }
    QuarterList:
      description: Cuatrimestres ordenados por código descendente.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Quarter' }
    QuarterCreated:
      description: Cuatrimestre creado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Quarter' }
    CourseList:
      description: Cursos existentes con datos del cuatrimestre.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Course' }
    CourseCreated:
      description: Curso creado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Course' }
    CatalogList:
      description: Actividades del catálogo.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/CatalogActivity' }
    CatalogCreated:
      description: Actividad del catálogo creada.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/CatalogActivity' }
    CatalogUpdated:
      description: Actividad del catálogo actualizada.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/CatalogActivity' }
    ComponentList:
      description: Componentes del curso con sus actividades individuales.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Component' }
    ComponentCreated:
      description: Componente creado y actividades generadas.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ComponentCreatedData' }
    StudentList:
      description: Estudiantes registrados.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Student' }
    EnrollmentList:
      description: Matrículas del curso.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Enrollment' }
    EnrollmentCreated:
      description: Matrícula creada; se reutilizó la cuenta si el correo ya existía.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/EnrollmentCreatedData' }
    GradeSaved:
      description: Nota y observación guardadas para una actividad individual.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/GradeSavedData' }
    GradeDetail:
      description: Nota y observación actuales; valores nulos si aún no se ha calificado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/GradeDetailData' }
    SessionList:
      description: Quince sesiones programadas ordenadas por número, incluidas las pendientes.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Session' }
    AttendanceSaved:
      description: Sesión existente con las condiciones completas guardadas.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Session' }
    Concentrate:
      description: Tabla calculada al consultar la base de datos.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ConcentrateData' }
    StudentCourseList:
      description: Cursos del estudiante autenticado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/StudentCourse' }
    StudentGrades:
      description: Tarjetas de actividades y resultado porcentual del curso.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/StudentGradesData' }
    StudentAttendance:
      description: Condiciones de asistencia del estudiante autenticado.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/StudentAttendanceEntry' }
