services:
  db:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-snp}
      MYSQL_USER: ${MYSQL_USER:-snp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  db_test:
    image: mysql:8.4.11
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Set MYSQL_TEST_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-snp_test}
      MYSQL_USER: ${MYSQL_TEST_USER:-snp_test}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  db_e2e:
    image: mysql:8.4.11
    profiles: ["e2e"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Set MYSQL_TEST_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-snp_test}
      MYSQL_USER: ${MYSQL_TEST_USER:-snp_test}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: snp-backend:local
    build: ./Backend
    working_dir: /app
    volumes:
      - ./Backend:/app
      - backend_vendor:/app/vendor
    environment:
      CI_ENVIRONMENT: development
      TZ: America/Costa_Rica
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-snp}
      DB_USERNAME: ${MYSQL_USER:-snp}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_TEST_HOST: db_test
      DB_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-snp_test}
      DB_TEST_USERNAME: ${MYSQL_TEST_USER:-snp_test}
      DB_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c 'if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi;
      mkdir -p writable/cache writable/logs writable/session writable/uploads;
      php spark serve --host 0.0.0.0 --port 8080'

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: /api
    ports:
      - "127.0.0.1:5173:5173"
    command: >-
      sh -c 'if [ ! -d node_modules/vite ]; then npm ci; fi;
      npm run dev -- --host 0.0.0.0'
    depends_on:
      - backend

  backend_e2e:
    image: snp-backend:local
    profiles: ["e2e"]
    working_dir: /app
    volumes:
      - ./Backend:/app
      - backend_vendor:/app/vendor
    environment:
      CI_ENVIRONMENT: development
      DB_TARGET: test
      DB_TEST_HOST: db_e2e
      DB_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-snp_test}
      DB_TEST_USERNAME: ${MYSQL_TEST_USER:-snp_test}
      DB_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      E2E_PROFESSOR_PASSWORD: e2e-fixture-only
      TZ: America/Costa_Rica
    depends_on:
      db_e2e:
        condition: service_healthy
    command: >-
      sh -ec 'if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi;
      mkdir -p writable/cache writable/logs writable/session writable/uploads;
      php spark migrate -g tests;
      php spark db:seed InitialDataSeeder;
      php spark db:seed E2EProfessorSeeder;
      php spark serve --host 0.0.0.0 --port 8080'
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/healt') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    profiles: ["e2e"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - e2e_node_modules:/app/node_modules
    environment:
      BACKEND_PROXY_TARGET: http://backend_e2e:8080
      E2E_PROFESSOR_PASSWORD: e2e-fixture-only
    depends_on:
      backend_e2e:
        condition: service_healthy
    command: >-
      sh -c 'if [ ! -d node_modules/vite ]; then npm ci; fi;
      npm run test:e2e'

  api_docs:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.33.1
    environment:
      SWAGGER_JSON_URL: /openapi.yaml
    volumes:
      - ./API-DOCS/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
      - ./API-DOCS/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
  e2e_node_modules:
