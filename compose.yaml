services:
  db:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-snp}
      MYSQL_USER: ${MYSQL_USER:-snp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  db_test:
    image: mysql:8.4.11
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Set MYSQL_TEST_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-snp_test}
      MYSQL_USER: ${MYSQL_TEST_USER:-snp_test}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./Backend
    working_dir: /app
    volumes:
      - ./Backend:/app
      - backend_vendor:/app/vendor
    environment:
      CI_ENVIRONMENT: development
      TZ: America/Costa_Rica
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-snp}
      DB_USERNAME: ${MYSQL_USER:-snp}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_TEST_HOST: db_test
      DB_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-snp_test}
      DB_TEST_USERNAME: ${MYSQL_TEST_USER:-snp_test}
      DB_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c 'if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi;
      mkdir -p writable/cache writable/logs writable/session writable/uploads;
      php spark serve --host 0.0.0.0 --port 8080'

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: /api
    ports:
      - "127.0.0.1:5173:5173"
    command: >-
      sh -c 'if [ ! -d node_modules/vite ]; then npm ci; fi;
      npm run dev -- --host 0.0.0.0'
    depends_on:
      - backend

  api_docs:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.33.1
    environment:
      SWAGGER_JSON_URL: /openapi.yaml
    volumes:
      - ./API-DOCS/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
      - ./API-DOCS/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
